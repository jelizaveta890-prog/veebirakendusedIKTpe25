<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Toa area kasutamine</title>
    <link rel="stylesheet" href="tubaStyle.css">
</head>
<body>

<h1>Lehel on kasutatud map area käske</h1>
<h1>Palun kliki hiirega erinevaid asju toas</h1>

<img src="tuba.jpg" alt="Tuba" usemap="#toakaart">

<map name="toakaart">
    <!-- 1. Oranž kapp vasakul -->
    <area shape="rect" coords="115,118,238,316" href="kapp.html" alt="Kapp">

    <!-- 2. Jalgpall põrandal -->
    <area shape="circle" coords="252,316,16" href="pall.html" alt="Pall">

    <!-- 3. Aken keskel -->
    <area shape="rect" coords="328,115,441,234" href="aken.html" alt="Aken">

    <!-- 4. Voodi paremal -->
    <area shape="poly" coords="383,250,547,250,556,218,589,218,589,277,611,277,611,316,457,316" href="voodi.html" alt="Voodi">

    <!-- 5. Gloobus kapi peal -->
    <area shape="circle" coords="144,218,20" href="globus.html" alt="Globus">

    <!-- 6. Roheline uks vasakul servas -->
    <area shape="rect" coords="8,106,58,333" href="uks.html" alt="Uks">

    <!-- 7. Pilt voodi kohal seinal -->
    <area shape="rect" coords="244,135,280,190" href="pilt.html" alt="Pilt">

    <!-- 8. Roheline tumba esiplaanil (vaiba peal) -->
    <area shape="rect" coords="180,345,257,402" href="tumba.html" alt="Tumba">
</map>



<div id="selgitus">
    <p>
        Kapp on ühe või mitme uksega mööbliese asjade hoidmiseks.
        Antiikajal tunti küll juba enamikku mööbliesemeid, mis on kasutusel
        tänapäeval, kuid kappi kasutati üksnes kauplusemööblina, mitte
        kodumajapidamises.
    </p>
</div>

</body>
</html>
