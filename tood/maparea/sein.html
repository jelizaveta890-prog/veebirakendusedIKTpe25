<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map area kasutamine</title>
    <link rel="stylesheet" href="mapStyle.css">
</head>
<body>
<h1>Lehel on kasutatud map area käsud</h1>
<h1>palun kliki hiirega erineva alale pildi</h1>
<img src="maja.png" alt="ilus majake" usemap="#majakaart">
<!-- kasutame map'i (kaart)-->
<map name="majakaart">

<!-- ring -circle coords=x, y, R -->
    <area shape="circle" coords="149,64,50" href="aken.html" alt="aken">
    <!-- ristkülik rect coords=x, y, x1, y2-->
    <area shape="rect" coords="186,1,216,45" href="korsten.html" alt="korsten">
    <!-- mitu nurga polügoon -poly coords=x, y, x1, y1, x2, y2-->
    <area shape="poly" coords="39,94,149,10,258,94" href="katus.html" alt="katus">
    <!-- 4. Uks (Ristkülik) -->
    <area shape="rect" coords="160,146,206,217" href="uks.html" alt="uks">
    <!-- 5. Muru (Ristkülik pildi allosas) -->
    <area shape="rect" coords="0,217,310,296" href="muru.html" alt="muru">
    <!-- 6. Maja sein (Ristkülik ümber alumise korruse fassaadi) -->
    <area shape="rect" coords="39,112,238,217" href="sein.html" alt="maja sein">

</map>
<div id="selgitus">
    <h2>Sein (Maja sein)</h2>
    <p>Vajuta maja osade peale (kollane aken, sinine uks, hall korsten, roheline muru, sinine katus), et näha kirjeldust.</p>
    <br>
    <br>
    <img src="sein.jpg" alt="Sein">
    <br>
    <p>
        Sein on hoone harilikult püstne piirdetarind, mis võib olla ka kandetarindiks.
    </p>
</div>


</body>
</html>
