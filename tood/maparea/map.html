<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map area kasutamine</title>
    <link rel="stylesheet" href="mapStyle.css">
</head>
<body>
<h1>Lehel on kasutatud map area käsud</h1>
<h1>palun kliki hiirega erineva alale pildi</h1>
<img src="maja.png" alt="ilus majake" usemap="#majakaart">
<!-- kasutame map'i (kaart)-->
<map name="majakaart">

<!-- ring -circle coords=x, y, R -->
    <area shape="circle" coords="149,64,50" href="aken.html" alt="aken">
    <!-- ristkülik rect coords=x, y, x1, y2-->
    <area shape="rect" coords="186,1,216,45" href="korsten.html" alt="korsten">
    <!-- mitu nurga polügoon -poly coords=x, y, x1, y1, x2, y2-->
    <area shape="poly" coords="39,94,149,10,258,94" href="katus.html" alt="katus">
</map>
<div id="selgitus">
    Vajuta pildiala peale ja siia tuleb väike kirjeldus...

</div>

</body>
</html>
