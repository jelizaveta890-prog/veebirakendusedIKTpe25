<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Küsitlusleht</title>
  <script src="../js/MuusikaKusimustikScript.js"></script>
  <link rel="stylesheet" href="MuusikaKusimustikStyle.css">
</head>
<body>

<h1>Muusikaküsitlus</h1>
<form id="ankeet">
  <table>
    <tr>
      <td>Milliseid muusikuid/ansambleid sa tead?</td>
      <td>
        <input type="checkbox" name="valik" id="m1" value="Terminaator" onchange="muusikaMuutus('1')">
        <label for="m1">Terminaator</label><br>
        <input type="checkbox" name="valik" id="m2" value="Smilers" onchange="muusikaMuutus('2')">
        <label for="m2">Smilers</label><br>
        <input type="checkbox" name="valik" id="m3" value="Anne Veski" onchange="muusikaMuutus('3')">
        <label for="m3">Anne Veski</label><br>
        <input type="checkbox" name="valik" id="m4" value="5MIINUST" onchange="muusikaMuutus('4')">
        <label for="m4">5MIINUST</label><br>
        <input type="checkbox" name="valik" id="m5" value="Tommy Cash" onchange="muusikaMuutus('5')">
        <label for="m5">Tommy Cash</label>
        <div id="muusikaVastus"></div>
        <img id="pilt1" src="" alt="pilt" style="display: none;">
      </td>
    </tr>
    <tr>
      <td><label for="kool">Mida arvad muusika kuulamisest koolis?</label></td>
      <td>
        <textarea id="kool" oninput="koolMuutus()"></textarea>
        <div id="koolVastus"></div>
        <img id="pilt2" src="" alt="pilt" style="display: none;">
      </td>
    </tr>
    <tr>
      <td><label for="tunnid">Mitu tundi päevas sa kuulad muusikat?</label></td>
      <td>
        <input type="range" id="tunnid" min="0" max="24" value="0" oninput="tunnidMuutus()">
        <div id="tunnidVastus"></div>
        <img id="pilt3" src="" alt="pilt" style="display: none;">
      </td>
    </tr>
    <tr>
      <td>Kas sa kuulad raadiot?</td>
      <td>
        <input type="radio" name="raadio" id="rJah" value="jah" onclick="raadioMuutus(this.value)">
        <label for="rJah">jah</label><br>
        <input type="radio" name="raadio" id="rEi" value="ei" onclick="raadioMuutus(this.value)">
        <label for="rEi">ei</label>
        <div id="raadioVastus"></div>
        <img id="pilt4" src="" alt="pilt" style="display: none;">
      </td>
    </tr>
    <tr>
      <td><label for="jaamad">Milliseid raadiojaamu oskad nimetada?</label></td>
      <td>
        <input type="text" id="jaamad" oninput="jaamadMuutus()">
        <div id="jaamadVastus"></div>
        <img id="pilt5" src="" alt="pilt" style="display: none;">
      </td>
    </tr>
    <tr>
      <td><label for="stiil">Millist muusikat sa kõige rohkem kuulad?</label></td>
      <td>
        <select id="stiil" onchange="stiilMuutus()">
          <option value="Vali">Vali...</option>
          <option value="Pop">Pop</option>
          <option value="Rock">Rock</option>
          <option value="Räp">Räp</option>
          <option value="Jazz">Jazz</option>
          <option value="Klassika">Klassika</option>
          <option value="Elektrooniline">Elektrooniline</option>
        </select>
        <div id="stiilVastus"></div>
        <img id="pilt6" src="" alt="pilt" style="display: none;">
      </td>
    </tr>
    <tr>
      <td>Tegevused</td>
      <td>
        <div class="nupud">
          <input type="reset" value="Puhasta" onclick="vormPuhasta()">
          <input type="button" value="Saada" onclick="vormSaada()">
        </div>
        <div id="kokkuvote"></div>
      </td>
    </tr>
  </table>
</form>

</body>
</html>
