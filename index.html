<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Jelizaveta veebirakenduste aluste tööd</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"
          integrity="sha256-AlTido85uXPlSyyaZNsjJXeCs07eSv3r43kyCVc8ChI="
          crossorigin="anonymous"></script>

  <script src="tood/js/kuupaevaFunktsioonid.js"></script>

  <script>
    $(document).ready(function() {
      $('#osa1').draggable();

      // Paremale nupu vajutamine
      $('#paremale').click(function(){
        $('#osa1').animate({left: '200px'}, 1000);
        $(this).hide();
        $('#vasakule').show();
      });

      // Vasakule nupu vajutamine
      $('#vasakule').click(function(){
        $('#osa1').animate({left: '0px'}, 1000);
        $(this).hide();
        $('#paremale').show();
      });
    });
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Päis -->
<header>
  <h1>Jelizaveta veebirakenduste aluste tööd</h1>
</header>

<!-- Navigeerimismenüü -->
<nav>
  <ul>
    <li><a href="index.html">Avaleht</a></li>
    <li><a href="kontakt.html">Kontakt</a></li>
    <li><a href="tehtud.html">Tehtud tööd</a></li>
    <li><a href="lingid.html">Kasulikud lingid</a></li>
    <li><a href="meedia.html">Meedia</a></li>
  </ul>
</nav>

<!-- Sisu -->
<section id="osa1">
  <h2>Tere tulemast!</h2>
  <p>See on veebirakenduste tunnis käsitsi kirjutatud leht!</p>
  <br>
  <p>Palun kasuta navigeerimismenüü, et leida info!</p>

  <div class="nupud">
    <input type="button" value="paremale" id="paremale">
    <input type="button" value="vasakule" id="vasakule" style="display:none;">
  </div>
</section>

<main>
  <section id="osa2">
    <h2>Päevapilt</h2>
    <div>Ise tehtud pilt
      <img src="Lill.png" alt="See on roosa lill" id="erapilt">
    </div>

    <div>
      <button onclick="tanaOn()">TÄNA ON</button>
      <button onclick="arvutaSynnipaevani()">Minu sünnipäevani</button>
    </div>
    <br>
    <div id="vastus" style="margin-top: 15px; font-weight: bold;"></div>
    <br>
  </section>
</main>

<!-- Jalus -->
<footer>
  <div>
    Jeizaveta leht
  </div>
</footer>

</body>
</html>
